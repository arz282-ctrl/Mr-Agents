name: Universal Skills & Multi-Agent Matrix

on:
  push:
    branches: [ main, feat/universal-skills, feat/add-manus-skills ]
  pull_request:
    branches: [ main, feat/universal-skills, feat/add-manus-skills ]

jobs:
  validate-and-test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate and normalize canonical skills
        run: python3 tools/normalize.py

      - name: Verify dist/ and catalog.json are up-to-date
        shell: bash
        run: |
          if [ -n "$(git status --porcelain dist/ packs.json)" ]; then
            echo "❌ Error: dist/ or packs.json is out of date. Run 'python3 tools/normalize.py' and commit changes."
            git status --porcelain dist/ packs.json
            exit 1
          fi
          echo "✅ Canonical dist/ and catalog.json are fresh and verified."

      - name: Run full test suite
        run: npm test

      - name: Verify Manus packaging pipeline
        run: python3 tools/run_manus_repackage.py
